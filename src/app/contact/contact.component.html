<section class="py-16 text-white">
  <div class="container mx-auto px-4">
    <h2 class="text-4xl font-semibold text-center mb-12">Dites-nous ce dont vous avez besoin !</h2>

    <div class="flex flex-col md:flex-row gap-10" data-aos="fade-down" data-aos-duration="2000" data-aos-delay="400">
      
      <!-- Formulaire -->
      <form class="flex-1 space-y-6" #contactForm="ngForm" (ngSubmit)="onSubmit(contactForm)" novalidate>
        <div>
          <label for="name" class="block mb-1 font-medium">Nom *</label>
          <input type="text" id="name" name="name" ngModel required
            class="w-full px-4 py-2 bg-transparent border border-gray-500 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-white">
        </div>

        <div>
          <label for="email" class="block mb-1 font-medium">Email *</label>
          <input type="email" id="email" name="email" ngModel required email
            class="w-full px-4 py-2 bg-transparent border border-gray-500 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-white">
        </div>

        <div>
          <label for="message" class="block mb-1 font-medium">Message *</label>
          <textarea id="message" name="message" rows="5" ngModel required
            class="w-full px-4 py-2 bg-transparent border border-gray-500 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-white"></textarea>
        </div>

        <!-- Honeypot anti-spam -->
        <input type="text" id="honeypot" name="honeypot" ngModel style="display: none;" autocomplete="off">

        <button [disabled]="contactForm.invalid"
          class="w-full rounded-full bg-white text-black px-6 py-3 text-sm md:text-base font-semibold transition hover:bg-[#cca44c] active:bg-[#cca44c] disabled:bg-[#ddd2b0] disabled:text-gray-500 disabled:cursor-not-allowed">
          Envoyer
        </button>
      </form>

      <!-- Carte + infos -->
      <div class="flex-1 flex flex-col gap-4">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d629.5163808460857!2d4.308256069654159!3d50.8669866982297!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47c3c15f1b0b2e29%3A0xbf8e2781050f3db8!2sAv.%20Josse%20Goffin%20244%2C%201082%20Berchem-Sainte-Agathe!5e0!3m2!1sfr!2sbe!4v1745255261688!5m2!1sfr!2sbe" 
          width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
        </iframe>

       <!-- Infos contact -->
        <div class="mt-4 space-y-3 text-white text-sm md:text-base">

        <!-- Téléphone -->
        <p class="flex items-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg"
                class="w-5 h-5 text-[#cca44c] flex-shrink-0"
                fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round"
                    d="M2 3c0-1.1.9-2 2-2h2c.9 0 1.7.6 1.9 1.5l.7 2.7c.2.8 0 1.6-.6 2.2L6.9 9.6c1.5 3.1 4 5.6 7.1 7.1l1.2-1.2c.6-.6 1.4-.8 2.2-.6l2.7.7c.9.2 1.5 1 1.5 1.9v2c0 1.1-.9 2-2 2H19C9.6 23 2 15.4 2 6V3z"/>
            </svg>

            <a href="tel:+32479953377" class="hover:text-[#cca44c] transition">
            +32 479 95 33 77 
            </a>/
            <a href="tel:+32472574254" class="hover:text-[#cca44c] transition">
            +32 472 57 42 54
            </a>
        </p>

        <!-- Email -->
        <p class="flex items-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg"
                class="w-5 h-5 text-[#cca44c] flex-shrink-0"
                fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round"
                    d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm16 2-8 5-8-5"/>
            </svg>

            <a href="mailto:contact@maison-lemire.be" class="hover:text-[#cca44c] transition">
            contact&#64;maison-lemire.be
            </a>
        </p>

        <!-- Adresse -->
        <p class="flex items-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg"
                class="w-5 h-5 text-[#cca44c] flex-shrink-0"
                fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 2a7 7 0 0 0-7 7c0 4.7 7 13 7 13s7-8.3 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
            </svg>

            Av. Josse Goffin 244, 1082 Berchem-Sainte-Agathe
        </p>

        </div>

      </div>

    </div>
  </div>
</section>
